name: Build and deploy via K-Le-PaaS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "배포할 기존 이미지 태그 (예: sha-<commit>). 비우면 현재 커밋을 빌드해 배포"
        required: false
        default: ""

permissions:
  contents: read
  packages: write
  id-token: write   # K-Le-PaaS 배포 요청에 쓰는 GitHub OIDC 토큰 발급

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04-arm   # 운영 노드와 같은 arm64에서 에뮬레이션 없이 빌드

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Choose image tag
        id: image
        env:
          REQUESTED_TAG: ${{ inputs.image_tag }}
        run: |
          if [ -n "$REQUESTED_TAG" ]; then
            echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.image.outputs.build == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test
        if: steps.image.outputs.build == 'true'
        run: node --test

      - name: Login to GHCR
        if: steps.image.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.image.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push linux/arm64 image
        if: steps.image.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}

      - name: Trigger K-Le-PaaS deployment
        shell: bash   # pipefail: 배포 요청이 실패하면 jq가 아니라 curl의 실패로 단계가 실패한다
        env:
          # 공개 저장소라 운영 주소가 로그에 남지 않도록 secret으로 둔다.
          # 저장소 ID는 비밀이 아니고, secret이면 로그의 같은 숫자가 모두 가려져 variable로 둔다
          KLEPAAS_DEPLOY_URL: ${{ secrets.KLEPAAS_DEPLOY_URL }}
          KLEPAAS_REPOSITORY_ID: ${{ vars.KLEPAAS_REPOSITORY_ID }}
          IMAGE_URI: ${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}
        run: |
          if [ -z "$KLEPAAS_DEPLOY_URL" ] || [ -z "$KLEPAAS_REPOSITORY_ID" ]; then
            echo "::error::KLEPAAS_DEPLOY_URL secret 또는 KLEPAAS_REPOSITORY_ID variable이 없습니다. K-Le-PaaS 등록 후 설정하세요."
            exit 1
          fi
          # 실행마다 발급되는 단기 토큰. K-Le-PaaS가 저장소·브랜치·커밋 claim을 요청과 대조한다
          OIDC_TOKEN=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=k-le-paas" | jq -r .value)
          test -n "$OIDC_TOKEN"
          echo "::add-mask::$OIDC_TOKEN"
          echo "Deploying ${IMAGE_URI} (commit ${GITHUB_SHA})"
          curl -sS --fail-with-body -X POST "$KLEPAAS_DEPLOY_URL" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"repository_id\": ${KLEPAAS_REPOSITORY_ID},
              \"branch_name\": \"${GITHUB_REF_NAME}\",
              \"commit_hash\": \"${GITHUB_SHA}\",
              \"image_uri\": \"${IMAGE_URI}\"
            }" | jq '{status, deployment_id: .data.id, deployment_status: .data.status, image_uri: .data.image_uri}'
